name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: 'Publish to VS Code Marketplace (requires VSCE_PAT repository secret)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Test, Package, Release & Optional Marketplace Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run test suite
        run: npm test

      - name: Package .vsix
        run: npx --yes @vscode/vsce package --no-dependencies

      - name: Resolve VSIX filename and version
        id: meta
        run: |
          VSIX=$(ls -1 *.vsix | head -n 1)
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.vsix }}" --clobber
          else
            gh release create "${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.vsix }}" \
              --title "Agent Arena ${{ steps.meta.outputs.tag }}" \
              --generate-notes
          fi

      - name: Publish to VS Code Marketplace
        if: github.event_name != 'workflow_dispatch' || inputs.publish_marketplace == true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::VSCE_PAT secret is not configured; skipped VS Code Marketplace publish. Upload .vsix from the GitHub Release or run 'npx @vscode/vsce publish -p <PAT>'."
            exit 0
          fi
          npx --yes @vscode/vsce publish --packagePath "${{ steps.meta.outputs.vsix }}" -p "$VSCE_PAT"
